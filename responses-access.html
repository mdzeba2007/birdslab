<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Application Responses</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="open-positions.css">
    <style>
        .login-card {
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 450px;
            margin: 80px auto;
            box-shadow: 0 8px 24px rgba(140, 149, 159, 0.2);
            text-align: center;
        }

        .login-icon {
            font-size: 40px;
            color: #0969da;
            margin-bottom: 16px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 700;
            color: #1f2328;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #636c76;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #1f2328;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .login-btn {
            width: 100%;
            background-color: #0969da;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #0250ae;
        }

        .error-message {
            color: #cf222e;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 13px;
            color: #0969da;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->
    <header class="site-header">
        <a href="indexlokesh.html" class="brand">
            <img src="iitjlogo.png" alt="BIRDLab" class="brand-logo">
            <span class="brand-text">BIRDLab</span>
        </a>
    </header>

    <!-- =====================================================
         SECURITY / LOGIN CARD FOR RESPONSES SHEET
    ====================================================== -->
    <div class="login-card">
        <i class="fa-solid fa-user-shield login-icon"></i>
        <h2 class="login-title">Responses Security Check</h2>
        <p class="login-subtitle">Enter admin credentials to access candidate response data.</p>

        <form id="responsesLoginForm">
            <div class="form-group">
                <label for="adminEmail">Email Address</label>
                <input type="email" id="adminEmail" required placeholder="Enter admin email">
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" required placeholder="Enter password">
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-lock-open"></i> Access Responses Sheet
            </button>

            <p id="errorMessage" class="error-message">Invalid Email or Password. Access Denied.</p>
        </form>

        <a href="open-positions.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Back to Open Positions
        </a>
    </div>

    <!-- =====================================================
         AUTHENTICATION SCRIPT
    ====================================================== -->
    <script>
        // Set your target Google Sheet response URL here
        const RESPONSE_SHEET_URL = "https://docs.google.com/spreadsheets/d/12PpgVi5yE--STLRP3Z_WBy8jOUwx8ad4ZD3cfxQcE4Q/edit?usp=sharing";

        // Admin Credentials
        const ADMIN_EMAIL = "nextgenlab1234@gmail.com";
        const ADMIN_PASSWORD = "password@2026";

        document.getElementById("responsesLoginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const emailInput = document.getElementById("adminEmail").value.trim();
            const passwordInput = document.getElementById("adminPassword").value.trim();
            const errorMsg = document.getElementById("errorMessage");

            if (emailInput === ADMIN_EMAIL && passwordInput === ADMIN_PASSWORD) {
                errorMsg.style.display = "none";
                // Redirect directly to the protected Google Sheet response view
                window.location.href = RESPONSE_SHEET_URL;
            } else {
                errorMsg.style.display = "block";
            }
        });
    </script>

</body>

</html>
