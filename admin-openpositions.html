<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIRDLab Open-Positions Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #3a4155,
                #657cda
            );
        }

        .admin-container {
            width: 420px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .admin-container img {
            width: 90px;
            margin-bottom: 15px;
        }

        .admin-container h1 {
            margin-bottom: 10px;

            color: #333;
        }

        .admin-container p.desc {
            color: #666;

            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }

        .admin-container input {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;
        }

        .admin-container input:focus {
            outline: none;

            border-color: #657cda;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #657cda;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover {
            background: #4f65c0;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;

            min-height: 20px;

            font-size: 14px;
            font-weight: 500;
        }

        .back-btn {
            display: inline-block;

            margin-top: 20px;

            color: #657cda;

            text-decoration: none;

            font-size: 14px;
        }

        .back-btn:hover {
            text-decoration: underline;
        }
    </style>

</head>

<body>

    <div class="admin-container">

        <img
            src="iitjlogo.png"
            alt="IIT Jodhpur"
        >

        <h1>
            Open Positions Admin
        </h1>

        <p class="desc">
            Administrator login required to manage recruitment announcements, posters, and open positions.
        </p>

        <form id="adminLoginForm" onsubmit="return false;">
            <input
                type="email"
                id="email"
                placeholder="Admin Email"
                required
                autocomplete="username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
                autocomplete="current-password"
            >

            <button
                class="login-btn"
                id="loginBtn"
                type="submit"
            >
                Login & Access Dashboard
            </button>
        </form>

        <p id="message"></p>

        <a
            href="open-positions.html"
            class="back-btn"
        >
            ← Back to Open Positions
        </a>

    </div>

    <script
        type="module"
        src="admin-openpositions.js"
    ></script>

</body>

</html>
