<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIRDLab Events Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(
                135deg,
                #1e293b,
                #334155 50%,
                #1e3a8a
            );
            padding: 20px;
        }

        .admin-container {
            width: 440px;
            max-width: 95%;
            background: #ffffff;
            padding: 42px 36px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 18px;
        }

        .logo-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .admin-container img {
            width: 82px;
            height: 82px;
            object-fit: contain;
        }

        .admin-container h1 {
            font-size: 24px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .admin-container p.desc {
            color: #64748b;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 26px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 15px;
        }

        .admin-container input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14.5px;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }

        .admin-container input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            margin-top: 6px;
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        .login-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #message {
            margin-top: 18px;
            min-height: 22px;
            font-size: 13.5px;
            font-weight: 500;
            line-height: 1.4;
        }

        .links-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #f1f5f9;
        }

        .back-btn {
            color: #2563eb;
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .back-btn:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .sheet-btn-link {
            color: #64748b;
            text-decoration: none;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s ease;
        }

        .sheet-btn-link:hover {
            color: #15803d;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <div class="logo-wrap">
            <img src="iitjlogo.png" alt="IIT Jodhpur BIRDLab">
        </div>

        <span class="brand-badge">
            <i class="fa-solid fa-calendar-check"></i> Events Portal
        </span>

        <h1>Events Admin Access</h1>

        <p class="desc">
            Sign in with administrative credentials to manage event details, upload posters, and organize upcoming & past events.
        </p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Administrator Email</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input
                        type="email"
                        id="email"
                        placeholder="admin@iitj.ac.in"
                        required
                        autocomplete="email"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                <i class="fa-solid fa-right-to-bracket"></i> Login & Manage Events
            </button>
        </form>

        <p id="message"></p>

        <div class="links-row">
            <a href="events.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Events
            </a>
            <a
                href="https://docs.google.com/spreadsheets/d/1CSlzKRnWN2CtiKCHTJUowHMF13_MdQBHNAUml7ouAvI/edit?gid=0#gid=0"
                target="_blank"
                rel="noopener noreferrer"
                class="sheet-btn-link"
                title="Open Events Google Sheet"
            >
                <i class="fa-solid fa-table"></i> Google Sheet
            </a>
        </div>

    </div>

    <script type="module" src="admin-events.js"></script>

</body>

</html>
