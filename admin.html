<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f7fb;

            font-family: Arial, sans-serif;
        }


        /* =================================
           LOGIN
        ================================= */

        .login-section {

            width: 450px;

            padding: 45px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);

            text-align: center;
        }


        .login-section h1 {

            margin-bottom: 30px;

            font-size: 36px;

            color: #123f78;
        }


        .login-section h2 {

            margin-bottom: 30px;

            font-size: 28px;

            color: #222;
        }


        #loginForm {

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        #loginForm input {

            width: 100%;

            padding: 17px;

            font-size: 18px;

            border: 1px solid #bbb;

            border-radius: 10px;

            outline: none;
        }


        #loginForm input:focus {

            border-color: #1769d1;

            box-shadow:
                0 0 0 3px rgba(23, 105, 209, 0.12);
        }


        #loginForm button {

            width: 100%;

            padding: 17px;

            font-size: 20px;

            font-weight: bold;

            color: white;

            background: #1769d1;

            border: none;

            border-radius: 10px;

            cursor: pointer;
        }


        #loginForm button:hover {

            background: #0d55b5;
        }


        #loginMessage {

            margin-top: 20px;

            font-size: 17px;

            color: #d32f2f;
        }


        /* =================================
           DASHBOARD
        ================================= */

        .dashboard {

            width: 90%;

            max-width: 1000px;

            min-height: 80vh;

            padding: 40px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.12);
        }


        .dashboard-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 35px;
        }


        .dashboard-header h2 {

            font-size: 32px;

            margin: 0;

            color: #123f78;
        }


        .dashboard-header p {

            font-size: 18px;

            color: #666;
        }


        .logout-button {

            padding: 12px 22px;

            font-size: 17px;

            background: #d32f2f;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }


        .section-title {

            font-size: 25px;

            color: #123f78;

            margin-top: 30px;
        }


        .profiles-container {

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        .admin-profile-card {

            padding: 25px;

            background: #f5f8ff;

            border: 1px solid #d5e2f5;

            border-radius: 14px;
        }


        .admin-profile-card h3 {

            font-size: 25px;

            margin-top: 0;

            color: #123f78;
        }


        .admin-profile-card p {

            font-size: 18px;

            line-height: 1.6;

            color: #444;
        }


        .admin-actions {

            display: flex;

            gap: 15px;

            margin-top: 20px;
        }


        .approve-button,
        .delete-button {

            padding: 12px 25px;

            font-size: 17px;

            font-weight: bold;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }


        .approve-button {

            background: #198754;

            color: white;
        }


        .delete-button {

            background: #d32f2f;

            color: white;
        }


        .no-members {

            padding: 25px;

            text-align: center;

            font-size: 20px;

            color: #666;

            background: #f5f8ff;

            border-radius: 12px;
        }

    </style>

</head>


<body>


    <!-- =====================================
         LOGIN
    ====================================== -->

    <section
        id="loginSection"
        class="login-section"
    >

        <h1>
            Admin Login
        </h1>


        <form id="loginForm">


            <input
                type="email"
                id="adminEmail"
                placeholder="Admin Email"
                required
            >


            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
                required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <p id="loginMessage"></p>

    </section>



    <!-- =====================================
         DASHBOARD
    ====================================== -->

    <section
        id="dashboard"
        class="dashboard"
        style="display: none;"
    >


        <div class="dashboard-header">

            <div>

                <h2>
                    Pending Profiles
                </h2>

                <p>
                    Review submitted profiles.
                </p>

            </div>


            <button
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </div>


        <div
            id="pendingProfiles"
            class="profiles-container"
        ></div>


    </section>



    <script
        type="module"
        src="admin.js"
    ></script>


</body>

</html>
